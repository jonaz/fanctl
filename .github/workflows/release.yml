name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            bin="fanctl-linux-${arch}"
            GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${bin}" .
            sha256sum "${bin}" > "${bin}.sha256"
            cat "${bin}.sha256"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            fanctl-linux-amd64 fanctl-linux-amd64.sha256 \
            fanctl-linux-arm64 fanctl-linux-arm64.sha256 \
            fanctl.example.json fanctl.service \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "fanctl built from ${GITHUB_SHA}.
          sha256 linux-amd64: $(cut -d' ' -f1 fanctl-linux-amd64.sha256)
          sha256 linux-arm64: $(cut -d' ' -f1 fanctl-linux-arm64.sha256)"
